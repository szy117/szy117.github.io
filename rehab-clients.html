<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>康复客户档案</title>
<style>
:root{--ink:#17212b;--muted:#71808d;--line:#e7ecef;--paper:#f7f9fa;--teal:#147d74;--teal2:#e4f3f0;--orange:#d8753b;--red:#c75151;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:238px;background:#123d3b;color:#d7ece8;padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:700;font-size:20px;letter-spacing:1px;margin:0 12px 36px}.brand small{display:block;font-size:11px;opacity:.55;letter-spacing:2px;margin-top:5px}.nav a{display:flex;align-items:center;gap:12px;color:#a9cbc6;padding:13px 14px;border-radius:8px;margin:4px 0;text-decoration:none;font-size:14px}.nav a.active,.nav a:hover{background:#1c5752;color:#fff}.side-foot{margin-top:auto;font-size:12px;line-height:1.6;color:#83aba6;padding:14px}.main{flex:1;padding:28px 38px;max-width:1440px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{font-size:12px;color:var(--teal);font-weight:600;letter-spacing:1px}.top h1{margin:6px 0 4px;font-size:28px}.sub{color:var(--muted);font-size:13px}.primary{background:var(--teal);color:white;border-radius:7px;padding:11px 18px;font-weight:600;box-shadow:0 3px 10px #147d7430}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.stat{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px 19px;position:relative}.stat label{font-size:12px;color:var(--muted)}.num{font-size:27px;font-weight:700;margin-top:10px}.stat .hint{font-size:11px;color:var(--teal);position:absolute;right:18px;bottom:18px}.toolbar{background:white;border:1px solid var(--line);border-radius:8px 8px 0 0;padding:15px;display:flex;gap:10px;align-items:center}.search{flex:1;position:relative}.search input{width:100%;padding:10px 12px 10px 35px;border:1px solid var(--line);border-radius:6px;outline:none}.search span{position:absolute;left:12px;top:9px;color:#94a0a8}.toolbar select{padding:10px;border:1px solid var(--line);border-radius:6px;color:#5c6971;background:#fff}.ghost{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:6px;color:#45535c}.table-wrap{background:white;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px;min-width:950px}.table th{text-align:left;color:#87949c;font-weight:500;font-size:12px;background:#fbfcfc;padding:13px 15px;border-bottom:1px solid var(--line)}.table td{padding:14px 15px;border-bottom:1px solid #f0f2f3;vertical-align:middle}.table tr:last-child td{border:0}.table tr:hover td{background:#fcfefd}.person{display:flex;align-items:center;gap:10px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--teal2);color:var(--teal);font-weight:700;font-size:12px}.muted{color:var(--muted)}.tag{font-size:11px;padding:4px 8px;border-radius:4px;background:#f1f5f5;color:#54706e}.tag.warn{background:#fff1e8;color:var(--orange)}.tag.danger{background:#fff0f0;color:var(--red)}.progress{width:82px;height:6px;background:#e9eeee;border-radius:6px;display:inline-block;vertical-align:middle;margin-right:7px}.progress i{display:block;height:100%;background:var(--teal);border-radius:6px}.progress i.warn{background:var(--orange)}.act{color:var(--teal);background:none;padding:3px 7px;font-size:12px}.empty{text-align:center;padding:50px;color:var(--muted)}.modal{position:fixed;inset:0;background:#123d3b55;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:10px;padding:25px;box-shadow:0 20px 60px #123d3b30}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog h2{margin:0;font-size:20px}.close{background:none;color:#7c8a90;font-size:24px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#65747c;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);padding:10px;border-radius:6px;outline:none}.field textarea{min-height:74px;resize:vertical}.dialog-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.danger-btn{color:var(--red);background:#fff0f0;padding:10px 14px;border-radius:6px;margin-right:auto}.primary:active{transform:translateY(1px)}@media(max-width:800px){.side{width:68px;padding:22px 8px}.brand{font-size:0;margin:0 0 28px;text-align:center}.brand:first-letter{font-size:24px}.brand small,.nav a span,.side-foot{display:none}.nav a{justify-content:center;padding:13px 0}.main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.top h1{font-size:23px}.primary{padding:10px 12px}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">康复档案<small>CLIENT CARE</small></div><nav class="nav"><a class="active" href="#"><b>▦</b><span>客户档案</span></a><a href="#schedule"><b>◷</b><span>约课日程</span></a><a href="#"><b>⌁</b><span>数据概览</span></a></nav><div class="side-foot">团队空间<br>7 位康复师共同使用</div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">CLIENT DIRECTORY</div><h1>客户档案</h1><div class="sub">集中管理客户信息、课时与康复跟进 · <span id="cloudState">正在连接云端</span></div></div><div><button class="ghost" id="signOutBtn" style="margin-right:8px">退出</button><button class="primary" id="addBtn">＋ 新增客户</button></div></header>
<section class="stats"><div class="stat"><label>客户总数</label><div class="num" id="total">0</div><div class="hint">全部档案</div></div><div class="stat"><label>本周约课</label><div class="num" id="week">0</div><div class="hint">未来 7 天</div></div><div class="stat"><label>课时预警</label><div class="num" id="warning">0</div><div class="hint">剩余 ≤ 3 节</div></div><div class="stat"><label>活跃康复师</label><div class="num" id="therapists">0</div><div class="hint">正在跟进</div></div></section>
<div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="搜索姓名、症状或康复师" /></div><select id="gender"><option value="">全部性别</option><option>男</option><option>女</option></select><select id="status"><option value="">课时状态</option><option value="warn">即将用尽</option><option value="ok">课时充足</option></select><button class="ghost" id="clear">清除筛选</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>客户</th><th>性别 / 年龄</th><th>症状</th><th>课时进度</th><th>下次约课</th><th>康复师</th><th></th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">暂无客户记录，点击右上角新增第一位客户</div></div>
</main></div>
<div class="modal open" id="authModal"><div class="dialog" style="max-width:430px"><div class="dialog-head"><h2>登录客户档案</h2></div><p class="sub" id="authHelp" style="margin-bottom:18px">输入邮箱，我们会发送一次性登录链接。团队成员使用各自邮箱即可共同编辑。</p><div class="field"><label>邮箱</label><input id="authEmail" type="email" placeholder="name@example.com" /></div><button class="primary" id="authBtn" style="width:100%;margin-top:14px">发送登录邮件</button><div style="height:1px;background:var(--line);margin:22px 0"></div><div class="field"><label>也可以粘贴邮件中的登录链接</label><input id="pastedLink" type="url" placeholder="粘贴 Sign in 链接" /></div><button class="ghost" id="useLinkBtn" style="width:100%;margin-top:12px">使用已复制的登录链接</button></div></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle">新增客户</h2><button class="close" id="close">×</button></div><form id="form"><div class="form"><div class="field"><label>姓名 *</label><input name="name" required /></div><div class="field"><label>年龄</label><input name="age" type="number" min="0" max="120" /></div><div class="field"><label>性别</label><select name="gender"><option>女</option><option>男</option></select></div><div class="field"><label>康复师</label><input name="therapist" placeholder="如：李老师" /></div><div class="field full"><label>家庭住址</label><input name="address" /></div><div class="field full"><label>症状</label><input name="symptoms" placeholder="如：腰椎疼痛、活动受限" /></div><div class="field full"><label>病史</label><textarea name="history"></textarea></div><div class="field"><label>总课时</label><input name="totalLessons" type="number" min="0" /></div><div class="field"><label>已消耗课时</label><input name="usedLessons" type="number" min="0" /></div><div class="field"><label>下次约课时间</label><input name="nextClass" type="datetime-local" /></div></div><div class="dialog-foot"><button type="button" class="danger-btn" id="deleteBtn">删除档案</button><button type="button" class="ghost" id="cancel">取消</button><button class="primary">保存档案</button></div></form></div></div>
<script>
const seed=[{id:1,name:'王秀兰',age:63,gender:'女',address:'静安区南京西路 88 号',symptoms:'膝关节疼痛、上下楼困难',history:'高血压；2024 年膝关节退行性病变',totalLessons:20,usedLessons:14,nextClass:'2026-08-12T10:00',therapist:'李晓芸'},{id:2,name:'陈建国',age:57,gender:'男',address:'浦东新区张江路 201 号',symptoms:'腰椎间盘突出',history:'2023 年腰椎手术',totalLessons:12,usedLessons:10,nextClass:'2026-08-11T14:30',therapist:'周明远'},{id:3,name:'赵敏',age:42,gender:'女',address:'徐汇区衡山路 36 号',symptoms:'肩周炎、手臂麻木',history:'无特殊病史',totalLessons:24,usedLessons:8,nextClass:'2026-08-15T09:00',therapist:'李晓芸'}];
const SUPABASE_URL='https://wcdchyoehcytaeahmlrf.supabase.co',SUPABASE_KEY='sb_publishable_7timrgpaPXlQgnA3u-NKoA_nv5h3wML',LIVE_URL='https://szy117.github.io/rehab-clients.html',SESSION_KEY='rehab-clients-session';
let data=JSON.parse(localStorage.getItem('rehab_clients_cloud')||'[]'),editing=null,session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?.()||String(Date.now());const headers=()=>({'apikey':SUPABASE_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_KEY}`,'Content-Type':'application/json'});async function request(path,options={}){let r=await fetch(SUPABASE_URL+path,{...options,headers:{...headers(),...(options.headers||{})}}),t=await r.text(),v=t?JSON.parse(t):null;if(!r.ok)throw Error(v?.message||`请求失败 ${r.status}`);return v}async function refreshSession(){if(!session?.refresh_token)return false;try{let next=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{Authorization:`Bearer ${SUPABASE_KEY}`},body:JSON.stringify({refresh_token:session.refresh_token})});session=next;localStorage.setItem(SESSION_KEY,JSON.stringify(session));return true}catch{return false}}async function loadCloud(){try{let rows=await request('/rest/v1/rehab_clients?select=payload&order=updated_at.desc');if(!rows.length){let old=JSON.parse(localStorage.getItem('rehab_clients')||'null');data=Array.isArray(old)&&old.length?old:seed;await Promise.all(data.map(item=>request('/rest/v1/rehab_clients?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:String(item.id),payload:item,updated_at:new Date().toISOString()})})))}else data=rows.map(x=>x.payload);localStorage.setItem('rehab_clients_cloud',JSON.stringify(data));$('#cloudState').textContent='云端已同步';render()}catch(e){$('#cloudState').textContent='连接失败';console.error(e)}}async function save(item){localStorage.setItem('rehab_clients_cloud',JSON.stringify(data));render();$('#cloudState').textContent='正在同步';try{await request('/rest/v1/rehab_clients?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:String(item.id),payload:item,updated_at:new Date().toISOString()})});$('#cloudState').textContent='云端已同步'}catch(e){$('#cloudState').textContent='等待同步';alert('已保存在本机，但云端同步失败：'+e.message)}}function fmt(d){if(!d)return '未安排';let x=new Date(d);return `${x.getMonth()+1}月${x.getDate()}日 ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`}function render(){let q=$('#search').value.toLowerCase(),g=$('#gender').value,s=$('#status').value;let rows=data.filter(x=>(!q||[x.name,x.symptoms,x.therapist].join('').toLowerCase().includes(q))&&(!g||x.gender===g)&&(!s||(s==='warn'?x.totalLessons-x.usedLessons<=3:x.totalLessons-x.usedLessons>3)));$('#total').textContent=data.length;$('#warning').textContent=data.filter(x=>x.totalLessons-x.usedLessons<=3).length;$('#therapists').textContent=new Set(data.map(x=>x.therapist).filter(Boolean)).size;$('#week').textContent=data.filter(x=>x.nextClass&&new Date(x.nextClass)-Date.now()<604800000&&new Date(x.nextClass)>Date.now()).length;$('#empty').style.display=rows.length?'none':'block';$('#tbody').innerHTML=rows.map(x=>{let left=Math.max(0,x.totalLessons-x.usedLessons),pct=x.totalLessons?Math.min(100,x.usedLessons/x.totalLessons*100):0;return `<tr><td><div class="person"><div class="avatar">${x.name.slice(0,1)}</div><div><b>${x.name}</b><div class="muted">${x.address||'未填写地址'}</div></div></div></td><td>${x.gender} / ${x.age||'-'} 岁</td><td>${x.symptoms||'-'}</td><td><span class="progress"><i class="${left<=3?'warn':''}" style="width:${pct}%"></i></span>${x.usedLessons}/${x.totalLessons} <span class="tag ${left<=3?'warn':''}">剩 ${left} 节</span></td><td>${fmt(x.nextClass)}</td><td>${x.therapist||'-'}</td><td><button class="act" onclick="edit('${x.id}')">查看 / 编辑</button></td></tr>`}).join('')}
function edit(id){editing=data.find(x=>String(x.id)===String(id));openForm()}function openForm(){let f=$('#form');$('#modalTitle').textContent=editing?'编辑客户':'新增客户';$('#deleteBtn').style.display=editing?'block':'none';f.reset();if(editing)Object.keys(editing).forEach(k=>{if(f.elements[k])f.elements[k].value=editing[k]||''});$('#modal').classList.add('open')}function close(){editing=null;$('#modal').classList.remove('open')}$('#addBtn').onclick=()=>openForm();$('#close').onclick=close;$('#cancel').onclick=close;$('#form').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));['age','totalLessons','usedLessons'].forEach(k=>o[k]=Number(o[k]||0));let item;if(editing){Object.assign(editing,o);item=editing}else{item={id:uid(),...o};data.unshift(item)}close();await save(item)};$('#deleteBtn').onclick=async()=>{if(editing&&confirm('确定删除这条档案吗？')){let id=editing.id;data=data.filter(x=>x.id!==id);localStorage.setItem('rehab_clients_cloud',JSON.stringify(data));render();close();try{await request('/rest/v1/rehab_clients?id=eq.'+encodeURIComponent(id),{method:'DELETE'});$('#cloudState').textContent='云端已同步'}catch(e){alert('删除同步失败：'+e.message)}}};['search','gender','status'].forEach(id=>$('#'+id).oninput=render);$('#clear').onclick=()=>{$('#search').value='';$('#gender').value='';$('#status').value='';render()};async function sendLink(){let email=$('#authEmail').value.trim();if(!email.includes('@'))return alert('请输入正确的邮箱');$('#authBtn').disabled=true;try{await request('/auth/v1/otp?redirect_to='+encodeURIComponent(LIVE_URL),{method:'POST',body:JSON.stringify({email,create_user:true})});$('#authHelp').textContent='邮件已发送，请打开最新邮件并点击登录链接。'}catch(e){alert(e.message)}finally{$('#authBtn').disabled=false}}async function useLink(){try{let raw=$('#pastedLink').value.trim();if(!raw)throw Error('请先粘贴完整链接');let u=new URL(raw),h=new URLSearchParams(u.hash.slice(1)),access=h.get('access_token');if(access){session={access_token:access,refresh_token:h.get('refresh_token'),expires_at:+h.get('expires_at'),token_type:h.get('token_type')}}else{let token=u.searchParams.get('token_hash')||u.searchParams.get('token'),type=u.searchParams.get('type')||'magiclink';if(!token)throw Error('复制的链接不完整');session=await request('/auth/v1/verify',{method:'POST',headers:{Authorization:`Bearer ${SUPABASE_KEY}`},body:JSON.stringify({token_hash:token,type})})}if(!session?.access_token)throw Error('未获得登录凭证');session.user=session.user||await request('/auth/v1/user');localStorage.setItem(SESSION_KEY,JSON.stringify(session));$('#authModal').classList.remove('open');await loadCloud()}catch(e){alert('登录失败：'+e.message+'。请使用最新邮件中的完整链接。')}}async function init(){let p=new URLSearchParams(location.hash.slice(1));if(p.get('access_token')){session={access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:+p.get('expires_at'),token_type:p.get('token_type')};session.user=await request('/auth/v1/user');localStorage.setItem(SESSION_KEY,JSON.stringify(session));history.replaceState(null,'',location.pathname)}if(session?.refresh_token){let ok=await refreshSession();if(ok){$('#authModal').classList.remove('open');await loadCloud();setInterval(refreshSession,45*60*1000);return}}session=null;localStorage.removeItem(SESSION_KEY);render()}$('#authBtn').onclick=sendLink;$('#useLinkBtn').onclick=useLink;$('#signOutBtn').onclick=()=>{localStorage.removeItem(SESSION_KEY);location.reload()};init();
</script></body></html>
